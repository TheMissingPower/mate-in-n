_ > nanoagent.plugin.v0001.ManifestConfig:
id: mate-in-n
name: Mate in N
version: 0.1.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_puzzle:
    description: Get a bundled chess puzzle by id, its starting position as a FEN and a board diagram, with White to move and n (1 or 2), the number of White moves within which White can force checkmate
  legal_moves:
    description: List every legal move of the side to move in a FEN position, in UCI, sorted; nothing else
  play_moves:
    description: Play 1 to 30 lines of 1 to 3 UCI moves, each separately from one FEN position, and return for each line the resulting FEN, the moves in SAN, whether the side to move then is in check, checkmated or stalemated and how many legal replies it has; a line stops at an illegal move, which its error names
  solve_puzzle:
    description: Give a bundled puzzle's answer key, every White first move that forces checkmate within n moves, for the verifier only

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  get-puzzle:
    description: Look up a bundled mate-in-n chess puzzle (n is 1 or 2) by id, such as m2-0042, giving its starting FEN, n and a board diagram; run it before solve-mate, which takes the FEN and n
    runner: tool
    tools: [get_puzzle]
    reference: null
    instructions: |-
      Give the puzzle id, such as m1-0007 or m2-0042. Ids run from m1-0001 to m1-0100 and from m2-0001 to m2-0100.
  solve-mate:
    description: Solve a mate-in-n chess puzzle (n is 1 or 2) by finding White's key move, which forces checkmate within n moves however Black defends, with a main line that ends in mate; its input is the puzzle_id, fen and mate_in that get-puzzle gives
    runner: agent
    tools: [legal_moves, play_moves]
    reference: solve_puzzle
    instructions: |-
      Goal. White is to move and can force checkmate within n White moves (n = mate_in, 1 or 2), however Black defends. Find the key: White's first move that forces this. A key is correct only if every legal Black reply still loses to mate within the remaining moves.
      Budget. Each of your replies is cut off after about 2000 tokens, thinking included, and a cut-off reply ends the task with no answer. You also have only a few steps. So think briefly: a few short sentences per step, never a long analysis. Let the tools calculate; do not work out lines in your head.
      Start. The task input already gives the puzzle's fen and mate_in. Call legal_moves on that fen right away, before analysing anything. It returns only the legal moves, in UCI; finding the mate is up to you.
      Batch. play_moves takes up to 30 lines, each 1 to 3 UCI moves played separately from the same fen, and returns for each line whether it ends in checkmate. Always test many candidates in one call, never one call per candidate.
      Mate in 1. Put every plausible key as its own one-move line (checks, captures, queen and rook moves near the black king) in one play_moves call, and submit a line whose checkmate is true.
      Mate in 2. In one play_moves call, try each candidate key as a one-move line: the fewer legal_replies Black has, the more promising. Then call legal_moves on the fen after your best key, and in one play_moves call from the start fen try each Black reply as a line [key, reply, White's mating move]. If some reply has no mate, move on to the next candidate. Stalemate is a draw, never a mate.
      Notation. Every move is UCI: the from square then the to square, with a promotion letter (q, r, b or n) when a pawn reaches the last rank, e.g. e2e4, g1f3, e7e8q. Never SAN such as Qh5 or Nf3.
      Submit. Call submit with puzzle_id (exactly as given), key_move (the key, in UCI) and main_line: a line play_moves showed ending in checkmate, starting with the key, at most 2n - 1 moves (1 for mate in 1, 3 for mate in 2). If you run low on steps, submit your best key with its best line rather than nothing.
