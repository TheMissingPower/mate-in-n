_ > nanoagent.plugin.v0001.ManifestConfig:
id: mate-in-n
name: Mate in N
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_puzzle:
    description: Get a bundled chess puzzle by id, its starting position as a FEN and a board diagram, with White to move and n, the number of White moves within which White can force checkmate
  legal_moves:
    description: List every legal move of the side to move in a FEN position, in UCI and in SAN, and whether that side is in check, checkmated or stalemated
  play_moves:
    description: Play 1 to 12 UCI moves in turn from a FEN position and return the resulting FEN, the moves in SAN, and whether the side to move then is in check, checkmated or stalemated; an illegal move is refused
  solve_puzzle:
    description: Give a bundled puzzle's answer key, every White first move that forces checkmate within n moves, for the verifier only

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  solve-mate:
    description: Solve a mate-in-n chess puzzle (n is 1, 2 or 3) by finding White's key move, which forces checkmate within n moves however Black defends, with a main line that ends in mate
    runner: agent
    tools: [get_puzzle, legal_moves, play_moves]
    reference: solve_puzzle
    instructions: |-
      Goal. White is to move and can force checkmate within n White moves, however Black defends. Find the key: White's first move that forces this. A key is correct only if every legal Black reply still loses to mate within the remaining moves; a move that mates only if Black defends badly is wrong.
      Start. Call get_puzzle with the task's puzzle_id, copied exactly. It returns the position as a FEN and a board diagram, and n (mate_in). The position has no castling rights and no en passant square.
      Notation. Every move is UCI: the from square then the to square, with a promotion letter (q, r, b or n) when a pawn reaches the last rank, e.g. e2e4, g1f3, e7e8q. Never SAN such as Qh5 or Nf3.
      Explore. legal_moves lists a position's legal moves and says whether the side to move is in check, checkmated or stalemated. play_moves plays moves from a FEN and returns the new FEN and the same flags; use it to test candidate keys and Black's best defences. Stalemate is a draw, never a mate. Look first at checks, captures and moves that take away the black king's squares, and test each candidate against Black's strongest replies before choosing it.
      Submit. Call submit with puzzle_id (exactly as given), key_move (the key, in UCI) and main_line: the key, then alternately a Black defence and White's reply, ending with White's checkmating move, all in UCI, at most 2n - 1 moves. Confirm with play_moves that the main line ends with checkmate true before you submit.
